<title>Mini Vestaboard</title>

<style>

:root {
  --board-bg: #080808;
  --tile-top: #242424;
  --tile-bottom: #171717;
  --tile-text: #f1f0e9;
  --gap: clamp(2px, .34vw, 6px);
  --radius: clamp(2px, .30vw, 5px);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--board-bg);
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  cursor: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
  transition: filter .5s ease;
}

body.night-dim {
  filter: brightness(.58);
}

#board-wrapper {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 2vh 1.5vw;

  background:
    radial-gradient(
      circle at center,
      #191919 0%,
      #080808 76%
    );
}

#board {
  display: grid;

  grid-template-columns:
    repeat(22, minmax(0, 1fr));

  grid-template-rows:
    repeat(6, minmax(0, 1fr));

  gap: var(--gap);

  transition:
    transform 1s ease;
}

.tile {
  position: relative;

  min-width: 0;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius:
    var(--radius);

  background:
    linear-gradient(
      to bottom,
      var(--tile-top) 0%,
      #1c1c1c 48%,
      #0c0c0c 49%,
      #0c0c0c 51%,
      #1a1a1a 52%,
      var(--tile-bottom) 100%
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -2px 4px rgba(0,0,0,.9),
    0 2px 3px rgba(0,0,0,.72);

  color:
    var(--tile-text);

  font-family:
    "Arial Narrow",
    "Roboto Condensed",
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    clamp(12px, 2.75vw, 34px);

  font-weight:
    700;

  line-height:
    1;

  text-align:
    center;

  text-shadow:
    0 1px 2px rgba(0,0,0,.9);

  transform:
    translateZ(0);
}

.tile::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 50%;

  height: 1px;

  background:
    rgba(0,0,0,.96);

  box-shadow:
    0 1px 0 rgba(255,255,255,.04);

  pointer-events:
    none;
}

.tile::before {
  content: "";

  position: absolute;

  left: 4%;
  right: 4%;

  top:
    calc(50% - 1px);

  height: 3px;

  border-left:
    1px solid rgba(255,255,255,.06);

  border-right:
    1px solid rgba(255,255,255,.06);

  pointer-events:
    none;
}

.character {
  position: relative;

  z-index: 2;

  transform:
    translateY(-1%);
}

.flipping {
  animation:
    tileFlip
    96ms
    linear;
}

@keyframes tileFlip {

  0% {
    transform:
      perspective(160px)
      rotateX(0deg);

    filter:
      brightness(1);
  }

  50% {
    transform:
      perspective(160px)
      rotateX(-58deg);

    filter:
      brightness(.55);
  }

  100% {
    transform:
      perspective(160px)
      rotateX(0deg);

    filter:
      brightness(1);
  }

}


/* COLOR TILES */

.tile.color-red {
  background: #b9413c !important;
}

.tile.color-orange {
  background: #d46f31 !important;
}

.tile.color-yellow {
  background: #d6b43d !important;
}

.tile.color-green {
  background: #4f8c56 !important;
}

.tile.color-blue {

}

.tile.color-purple {

}

.tile.color-white {

}

.tile.color-red .character,
.tile.color-orange .character,
.tile.color-yellow .character,
.tile.color-green .character,
.tile.color-blue .character,
.tile.color-purple .character,
.tile.color-white .character {

    transparent;

  text-shadow:
    none;
}


/* FULLSCREEN HINT */

#tap-hint {
  position: fixed;

  left: 50%;

  bottom:
    max(
      10px,
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  z-index:
    10;

  padding:

  border-radius:
    999px;

  background:
    rgba(0,0,0,.54);

  color:
    rgba(255,255,255,.66);

  font:
    12px/1
    Arial,
    Helvetica,
    sans-serif;

  opacity:
    0;

  pointer-events:
    none;

  transition:
    opacity
    180ms
    ease;
}

#tap-hint.show {
  opacity: 1;
}

@media
(prefers-reduced-motion: reduce) {

  .flipping {
    animation: none;
  }

}

</style>

/* =========================================================

function createBoard() {

  const fragment =
    document
      .createDocumentFragment();


  for (
    let i = 0;
    i < TILE_COUNT;
    i++
  ) {

    const tile =
      document
        .createElement(
          "div"
        );


    tile.className =
      "tile";


    const character =
      document
        .createElement(
          "span"
        );


    character.className =
      "character";


    character.textContent =
      " ";


    tile.appendChild(
      character
    );


    fragment.appendChild(
      tile
    );


    tiles.push({

      tile:
        tile,

      character:
        character

    });

  }


  board.appendChild(
    fragment
  );

}



/* =========================================================

  const maxHeight =
    Math.max(
      1,
      window.innerHeight * 0.92
    );


  let width =
    maxWidth;


  let height =
    width / BOARD_ASPECT;


  if (
    height > maxHeight
  ) {

    height =
      maxHeight;


    width =
      height * BOARD_ASPECT;

  }


  board.style.width =
    Math.floor(width)
    +
    "px";


  board.style.height =
    Math.floor(height)

}



/* =========================================================
   TEXT FORMATTING
   ========================================================= */

function normalizeText(value) {

  return String(

    value == null
      ?
      ""
      :
      value

  )

    .replace(
      /[\u2018\u2019]/g,
      "'"
    )

    .replace(
      /[\u201C\u201D]/g,
      '"'
    )

    .toUpperCase()

    .slice(
      0,
      COLUMNS
    );

}



function centerText(value) {

  const text =
    normalizeText(
      value
    );


  const remaining =
    COLUMNS
    -
    text.length;


  const left =
    Math.floor(
      remaining / 2
    );


  const right =
    remaining - left;


  return (

    " ".repeat(left)

    +

    text

    +

    " ".repeat(right)

  );

}



function formatLines(lines) {

  const output =
    [];


  for (
    let row = 0;
    row < ROWS;
    row++
  ) {

    const currentLine =

      (
        lines
        &&
        lines[row] != null
      )

      ?

      lines[row]

      :

      "";


    const centered =
      centerText(
        currentLine
      );


    const characters =
      centered.split(
        ""
      );


    for (
      let i = 0;
      i < characters.length;
      i++
    ) {

      output.push(
        characters[i]
      );

    }

  }


  if (
    output.length
    !==
    TILE_COUNT
  ) {

    throw new Error(

      "Expected "
      +
      TILE_COUNT
      +
      " tiles but got "
      +
      output.length

    );

  }


  return output;

}



/* =========================================================
   TILE COLORS
   ========================================================= */

function clearColors() {

  for (
    let i = 0;
    i < tiles.length;
    i++
  ) {

    tiles[i]
      .tile
      .classList
      .remove
      .apply(

        tiles[i].tile.classList,

        COLOR_CLASSES

      );

  }

}



function applyColors(colors) {

  clearColors();


  if (
    !Array.isArray(
      colors
    )
  ) {

    return;

  }


  for (
    let i = 0;
    i < colors.length;
    i++
  ) {

    const entry =
      colors[i];


    const row =
      Number(
        entry
        &&
        entry.row
      );


    const col =
      Number(
        entry
        &&
        entry.col
      );


    const color =
      String(

        (
          entry
          &&
          entry.color
        )

        ||

        ""

      )
        .toLowerCase();


    if (

      !Number.isInteger(row)

      ||

      !Number.isInteger(col)

    ) {

      continue;

    }


    if (

      row < 0

      ||

      row >= ROWS

      ||

      col < 0

      ||

      col >= COLUMNS

    ) {

      continue;

    }


    if (
      !VALID_COLORS.has(
        color
      )
    ) {

      continue;

    }


    tiles[
      row * COLUMNS + col
    ]
      .tile
      .classList
      .add(
        "color-" + color
      );

  }

}



/* =========================================================
   FLIP ANIMATION
   ========================================================= */

function randomFlipCharacter() {

  return (

    FLIP_CHARACTERS[

      Math.floor(

        Math.random()

        *

        FLIP_CHARACTERS.length

      )

    ]

  );

}



function animateTile(

  index,

  finalCharacter,

  delay,

  generation

) {

  const item =
    tiles[index];


  if (
    !item
    ||
    item.character.textContent
    ===
    finalCharacter
  ) {

    return;

  }


  window.setTimeout(

    function () {


      if (
        generation
        !==
        animationGeneration
      ) {

        return;

      }


      const totalFlips =

        MIN_FLIPS

        +

        Math.floor(

          Math.random()

          *

          (
            EXTRA_FLIPS + 1
          )

        );


      let flipCount =
        0;


      const interval =

        window.setInterval(

          function () {


            if (
              generation
              !==
              animationGeneration
            ) {

              window.clearInterval(
                interval
              );

              return;

            }


            item
              .tile
              .classList
              .remove(
                "flipping"
              );


            void item
              .tile
              .offsetWidth;


            item
              .tile
              .classList
              .add(
                "flipping"
              );


            flipCount++;


            if (
              flipCount
              >=
              totalFlips
            ) {

              window.clearInterval(
                interval
              );


              item
                .character
                .textContent =
                  finalCharacter;


              item
                .tile
                .classList
                .remove(
                  "flipping"
                );


              return;

            }


            item
              .character
              .textContent =
                randomFlipCharacter();

          },

          FLIP_SPEED_MS

        );

    },

    delay

  );

}



/* =========================================================
   DISPLAY SCENE
   ========================================================= */

function displayScene(scene) {

  if (
    !scene
  ) {

    return;

  }


  animationGeneration++;


  const generation =
    animationGeneration;


  const formatted =
    formatLines(
      scene.lines || []
    );


  applyColors(
    scene.colors
  );


  for (
    let index = 0;
    index < formatted.length;
    index++
  ) {

    const row =
      Math.floor(
        index / COLUMNS
      );


    const col =
      index % COLUMNS;


    const delay =

      col * 11

      +

      row * 33

      +

      Math.random() * 70;


    animateTile(

      index,

      formatted[index],

      delay,

      generation

    );

  }

}



/* =========================================================
   RANDOM MESSAGE WITHOUT REPEATING
   ========================================================= */

function randomIndexAvoidRepeat(

  length,

  lastIndex

) {

  if (
    length <= 1
  ) {

    return 0;

  }


  let index =
    Math.floor(
      Math.random() * length
    );


  if (
    index === lastIndex
  ) {

    index =

      (
        index

        +

        1

        +

        Math.floor(
          Math.random()
          *
          (length - 1)
        )

      )

      %

      length;

  }


  return index;

}



/* =========================================================
   DETERMINE TIME PERIOD
   ========================================================= */

function getPeriodInfo() {

  const hour =
    new Date()
      .getHours();


  if (
    hour >= 6
    &&
    hour < 12
  ) {

    return {

      name:
        "morning",

      messages:
        morningMessages,

      color:
        "yellow"

    };

  }


  if (
    hour >= 12
    &&
    hour < 17
  ) {

    return {

      name:
        "afternoon",

      messages:
        afternoonMessages,

      color:
        "blue"

    };

  }


  if (
    hour >= 17
    &&
    hour < 22
  ) {

    return {

      name:
        "evening",

      messages:
        eveningMessages,

      color:
        "orange"

    };

  }


  return {

    name:
      "night",

    messages:
      nightMessages,

    color:
      "purple"

  };

}



/* =========================================================
   COLORED CORNERS
   ========================================================= */

function coloredCorners(color) {

  return [

    {
      row: 0,
      col: 0,
      color: color
    },

    {
      row: 0,
      col: 21,
      color: color
    },

    {
      row: 5,
      col: 0,
      color: color
    },

    {
      row: 5,
      col: 21,
      color: color
    }

  ];

}



/* =========================================================
   TIME MESSAGE SCENE
   ========================================================= */

function buildTimeMessageScene() {

  const period =
    getPeriodInfo();


  const index =
    randomIndexAvoidRepeat(

      period.messages.length,

      lastTimeMessageIndex

    );


  lastTimeMessageIndex =
    index;


  return {

    lines:
      period.messages[index],

    colors:
      coloredCorners(
        period.color
      ),

    duration:
      TIME_MESSAGE_SECONDS

  };

}



/* =========================================================
   QUOTE SCENE
   ========================================================= */

function buildQuoteScene() {

  const index =
    randomIndexAvoidRepeat(

      inspirationalQuotes.length,

      lastQuoteIndex

    );


  lastQuoteIndex =

  return {

    lines:

}



/* =========================================================
   DATE + TIME SCENE
   ========================================================= */

function buildDateTimeScene() {

  const now =
    new Date();


  const weekday =

    new Intl.DateTimeFormat(

      "en-US",

      {
        weekday:
          "long"
      }

    )
      .format(
        now
      );


  const date =

    new Intl.DateTimeFormat(

      "en-US",

      {
        month:
          "long",

        day:
          "numeric"
      }

    )
      .format(
        now
      );


  const time =

    new Intl.DateTimeFormat(

      "en-US",

      {
        hour:
          "numeric",

        minute:
          "2-digit"
      }

    )
      .format(
        now
      );


  return {

    lines: [

      "",

      weekday,

      date,

      "",

      time,

      ""

    ],

    colors:
      [],

    duration:
      DATE_TIME_SECONDS

  };

}



/* =========================================================
   SPECIAL DATE SCENE
   ========================================================= */

function getSpecialDateScene() {

  const now =
    new Date();


  const mm =

    String(
      now.getMonth() + 1
    )
      .padStart(
        2,
        "0"
      );


  const dd =

    String(
      now.getDate()
    )
      .padStart(
        2,
        "0"
      );


  const lines =

    specialDates[
      mm + "-" + dd
    ];


  if (
    !lines
  ) {

    return null;

  }


  return {

    lines:
      lines,

    colors:
      coloredCorners(
        "green"
      ),

    duration:
      30

  };

}



/* =========================================================
   ROTATION LOGIC
   ========================================================= */

function getNextScene() {

  const special =
    getSpecialDateScene();


  if (
    special
    &&
    rotationStep % 4 === 0
  ) {

    rotationStep++;

    return special;

  }


  /*
     Normal repeating pattern:

     time-based message
     date/time
     quote
     time-based message
     quote
  */

  const pattern = [

    "time",

    "date",

    "quote",

    "time",

    "quote"

  ];


  const type =

    pattern[
      rotationStep
      %
      pattern.length
    ];


  rotationStep++;


  if (
    type === "date"
  ) {

    return buildDateTimeScene();

  }


  if (
    type === "quote"
  ) {

    return buildQuoteScene();

  }


  return buildTimeMessageScene();

}



/* =========================================================
   PLAY NEXT SCENE
   ========================================================= */

function playNextScene() {

  if (
    sceneTimer !== null
  ) {

    window.clearTimeout(
      sceneTimer
    );


    sceneTimer =
      null;

  }


  const scene =
    getNextScene();


  displayScene(
    scene
  );


  let duration =
    Number(
      scene.duration
    );


  if (

    !Number.isFinite(
      duration
    )

    ||

    duration < 2

  ) {

    duration =
      DEFAULT_SCENE_SECONDS;

  }


  sceneTimer =

    window.setTimeout(

      playNextScene,

      duration * 1000

    );

}



/* =========================================================
   NIGHT DIMMING
   ========================================================= */

function applyNightDimming() {

  if (
    !ENABLE_NIGHT_DIM
  ) {

    document.body
      .classList
      .remove(
        "night-dim"
      );

    return;

  }


  const hour =
    new Date()
      .getHours();


  const shouldDim =

    (
      NIGHT_DIM_START
      >
      NIGHT_DIM_END
    )

    ?

    (
      hour >= NIGHT_DIM_START
      ||
      hour < NIGHT_DIM_END
    )

    :

    (
      hour >= NIGHT_DIM_START
      &&
      hour < NIGHT_DIM_END
    );


  document.body
    .classList
    .toggle(

      "night-dim",

      shouldDim

    );

}



/* =========================================================
   MICRO PIXEL SHIFT
   ========================================================= */

function applyPixelShift() {

  const shifts = [

    [0,0],

    [1,0],

    [0,1],

    [-1,0],

    [0,-1]

  ];


  shiftIndex =

    (
      shiftIndex + 1
    )

    %

    shifts.length;


  board.style.transform =

    "translate("

    +

    shifts[shiftIndex][0]

    +

    "px,"

    +

    shifts[shiftIndex][1]

    +

    "px)";

}



/* =========================================================
   FULLSCREEN
   ========================================================= */

function enterFullscreen() {

  const element =
    document.documentElement;


  if (
    document.fullscreenElement
  ) {

    return;

  }


  if (
    typeof element.requestFullscreen
    ===
    "function"
  ) {

    try {

      const result =
        element.requestFullscreen();


      if (

        result

        &&

        typeof result.then
        ===
        "function"

      ) {

        result

          .then(
            hideFullscreenHint
          )

          .catch(
            function () {}
          );

      }

      else {

        hideFullscreenHint();

      }

    }

    catch (error) {}

    return;

  }


  if (
    typeof element.webkitRequestFullscreen
    ===
    "function"
  ) {

    try {

      element
        .webkitRequestFullscreen();


      hideFullscreenHint();

    }

    catch (error) {}

  }

}



/* =========================================================
   FULLSCREEN HINT
   ========================================================= */

function showFullscreenHint() {

  if (
    !SHOW_FULLSCREEN_HINT
    ||
    !tapHint
  ) {

    return;

  }


  tapHint
    .classList
    .add(
      "show"
    );


  window.clearTimeout(
    hintTimer
  );


  hintTimer =

    window.setTimeout(

      hideFullscreenHint,

      4500

    );

}



function hideFullscreenHint() {

  if (
    !tapHint
  ) {

    return;

  }


  tapHint
    .classList
    .remove(
      "show"
    );


  window.clearTimeout(
    hintTimer
  );

}



/* =========================================================
   WAKE LOCK
   ========================================================= */

function requestWakeLock() {

  if (

    !navigator

    ||

    !navigator.wakeLock

    ||

    typeof navigator.wakeLock.request
    !==
    "function"

  ) {

    return;

  }


  if (

    wakeLock

    &&

    wakeLock.released === false

  ) {

    return;

  }


  navigator
    .wakeLock
    .request(
      "screen"
    )

    .then(

      function (lock) {

        wakeLock =
          lock;


        if (

          wakeLock

          &&

          typeof wakeLock.addEventListener
          ===
          "function"

        ) {

          wakeLock
            .addEventListener(

              "release",

              function () {

                wakeLock =
                  null;

              }

            );

        }

      }

    )

    .catch(
      function () {}
    );

}



/* =========================================================
   AUTO REFRESH
   ========================================================= */

function scheduleAutoRefresh() {

  if (

    !Number.isFinite(
      AUTO_REFRESH_HOURS
    )

    ||

    AUTO_REFRESH_HOURS <= 0

  ) {

    return;

  }


  window.setTimeout(

    function () {

      window.location.reload();

    },

    AUTO_REFRESH_HOURS
    *
    60
    *
    60
    *
    1000

  );

}



/* =========================================================
   START APPLICATION
   ========================================================= */

function startApp() {

  createBoard();

  fitBoard();

  applyNightDimming();

  playNextScene();

  requestWakeLock();

  showFullscreenHint();

  scheduleAutoRefresh();


  /*
     Re-check whether night mode
     should be enabled every minute.
  */

  window.setInterval(

    applyNightDimming,

    60000

  );


  /*
     Tiny board position shift
     every five minutes.
  */

  window.setInterval(

    applyPixelShift,

    300000

  );

}



/* =========================================================
   EVENTS
   ========================================================= */

window.addEventListener(

  "resize",

  fitBoard

);


window.addEventListener(

  "orientationchange",

  function () {

    window.setTimeout(

      fitBoard,

      150

    );

  }

);


document.addEventListener(

  "click",

  enterFullscreen

);


document.addEventListener(

  "visibilitychange",

  function () {

    if (
      document.visibilityState
      ===
      "visible"
    ) {

      fitBoard();

      applyNightDimming();

      requestWakeLock();

    }

  }

);



/* =========================================================
   GO
   ========================================================= */

startApp();

</script>
